# Past and upcoming oSTEM annual conferences attended by the MSU chapter.
# The first entry is treated as the current/upcoming conference.
# Add a new entry each year after the conference.
#
# photo_folder: subfolder name inside assets/conference-photos/
#   Drop photos (.jpg, .jpeg, .png, .webp) into that folder and they appear automatically.
#   Name the folder in the convention:  conference-YEAR  (e.g. conference-2026)
#
# participants: list of first names of selected attendees (optional)
# itinerary: list of { day, events: [...] } blocks (optional)
# hotel_rooms: optional room assignments

