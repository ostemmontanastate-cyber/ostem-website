- title: "FAST Enterprises: From College to Career"
  date: 2026-09-29
  month: September
  day: "29"
  time: "6:30-7:30PM"
  location: "TBD (Check Discord)"
  description: "Join oSTEM and Gaby from the Fast Enterprises recruiting team for 'From College to Career: Transitioning into the Workplace.' Are you worried about the transition from college to career? This presentation discusses tools for coping with post-grad blues, learning what to expect during an internship or your first year on the job, and tips for starting your career on the right foot. Fast Enterprises is a software development and IT consulting company hiring problem solvers across CS, Engineering, Math, and other majors ahead of the MSU Career Fair!"
  perks: "Pizza Provided!"

